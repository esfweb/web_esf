<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8C49B1" />

    <!-- Robots: strictly noindex to keep out of search engine index -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Agendar Cita con Mary Rivera | Eversafe Financial</title>

    <!-- Preconnect to GoHighLevel Booking Target -->
    <link rel="preconnect" href="https://api.leadconnectorhq.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.leadconnectorhq.com" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/drghl4bjl/image/upload/f_auto,q_auto/v1783574808/eversafe-financial-isotype-circle-full-color_alp3lz.png"
    />

    <!-- Fallback Meta Refresh -->
    <meta
      id="meta-refresh"
      http-equiv="refresh"
      content="0; url=https://api.leadconnectorhq.com/widget/booking/dPjD3K2ESbGLgoRuoUpP"
    />

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #FAFBFD;
        color: #0B132B;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .redirect-card {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 1.5rem;
        box-shadow: 0 10px 30px rgba(140, 73, 177, 0.08);
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        text-align: center;
      }
      .logo {
        height: 48px;
        width: auto;
        margin: 0 auto 1.5rem;
        display: block;
      }
      .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(140, 73, 177, 0.15);
        border-top-color: #8C49B1;
        border-radius: 50%;
        margin: 0 auto 1.5rem;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0B132B;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        font-size: 0.875rem;
        color: #64748B;
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background-color: #8C49B1;
        color: #FFFFFF;
        text-decoration: none;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.875rem 1.5rem;
        border-radius: 0.875rem;
        transition: background-color 0.2s ease, transform 0.1s ease;
        box-shadow: 0 4px 12px rgba(140, 73, 177, 0.25);
      }
      .btn:hover {
        background-color: #793D9B;
        transform: translateY(-1px);
      }
      .footer-note {
        font-size: 0.75rem;
        color: #94A3B8;
        margin-top: 1.5rem;
      }
    </style>

    <script>
      (function() {
        var BASE_TARGET = 'https://api.leadconnectorhq.com/widget/booking/dPjD3K2ESbGLgoRuoUpP';
        
        function getRedirectUrl() {
          try {
            var target = new URL(BASE_TARGET);
            var search = window.location.search;
            var hash = window.location.hash;

            // Preserve compatible query parameters (e.g. UTM, attribution, pre-fills)
            // strictly locking down destination origin and pathname to prevent open redirects
            if (search && search.length > 1) {
              var params = new URLSearchParams(search);
              params.forEach(function(value, key) {
                // Sanitize key name to safe alphanumeric, underscore, dot, hyphen
                if (/^[a-zA-Z0-9_\-\.]{1,64}$/.test(key) && key !== '__proto__' && key !== 'constructor') {
                  target.searchParams.set(key, value);
                }
              });
            }

            // Ensure destination integrity: protocol and host must strictly match
            if (target.protocol === 'https:' && target.host === 'api.leadconnectorhq.com') {
              var finalHref = target.toString();
              if (hash && /^#[a-zA-Z0-9_\-\/]{1,64}$/.test(hash)) {
                finalHref += hash;
              }
              return finalHref;
            }
          } catch (e) {
            // In case of any parsing exception, fallback directly to BASE_TARGET
          }
          return BASE_TARGET;
        }

        var destination = getRedirectUrl();

        // Update meta-refresh fallback
        var metaRefresh = document.getElementById('meta-refresh');
        if (metaRefresh) {
          metaRefresh.setAttribute('content', '0; url=' + destination);
        }

        // Fast immediate navigation
        try {
          window.location.replace(destination);
        } catch (e) {
          window.location.href = destination;
        }

        // Synchronize fallback link when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
          var link = document.getElementById('fallback-link');
          if (link) {
            link.href = destination;
          }
        });
      })();
    </script>
  </head>
  <body>
    <main class="redirect-card">
      <img
        src="https://res.cloudinary.com/drghl4bjl/image/upload/f_auto,q_auto/v1783574808/eversafe-financial-isotype-full-color_gjverm.png"
        alt="Eversafe Financial Logo"
        class="logo"
      />
      <div class="spinner" aria-hidden="true"></div>
      <h1>Agendar Cita con Mary Rivera</h1>
      <p class="subtitle">
        Redirigiendo a la plataforma oficial de reservas...<br />
        <span style="font-size: 0.8125rem; color: #94A3B8;">Redirecting to the official booking calendar...</span>
      </p>

      <a
        id="fallback-link"
        href="https://api.leadconnectorhq.com/widget/booking/dPjD3K2ESbGLgoRuoUpP"
        class="btn"
      >
        Continuar al calendario &rarr;
      </a>

      <p class="footer-note">
        Eversafe Financial · Mary Rivera, Licensed Insurance Advisor
      </p>
    </main>
  </body>
</html>
