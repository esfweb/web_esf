    <link rel="icon" type="image/png" href="https://res.cloudinary.com/drghl4bjl/image/upload/f_auto,q_auto/v1783574808/eversafe-financial-isotype-circle-full-color_alp3lz.png" />

    <style>
      :root {
        --primary: #864da5;
        --primary-dark: #6e3a89;
        --text-dark: #0f172a;
        --text-muted: #64748b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #faf9f6;
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 36px 28px;
        max-width: 460px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        margin: 0 auto 18px;
        display: block;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #f1e7f6;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 16px auto 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 8px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 9999px;
        transition: background-color 0.15s ease, transform 0.15s ease;
      }
      .btn:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }
    </style>

    <!-- Immediate Client-Side Redirection preserving Query Parameters & Hash -->
    <script>
      (function () {
        var targetCalendarUrl = "https://api.leadconnectorhq.com/widget/booking/dPjD3K2ESbGLgoRuoUpP";
        var search = window.location.search || "";
        var hash = window.location.hash || "";
        window.location.replace(targetCalendarUrl + search + hash);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://api.leadconnectorhq.com/widget/booking/dPjD3K2ESbGLgoRuoUpP" />
    </noscript>
  </head>
  <body>
    <div class="card">
      <img
        class="logo"
        src="https://res.cloudinary.com/drghl4bjl/image/upload/f_auto,q_auto/v1783574808/eversafe-financial-isotype-circle-full-color_alp3lz.png"
        alt="Eversafe Financial"
      />
      <h1>Schedule an Appointment</h1>
      <p>Redirecting to Mary Rivera's official booking calendar...</p>
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <a
          id="manual-link"
          class="btn"
          href="https://api.leadconnectorhq.com/widget/booking/dPjD3K2ESbGLgoRuoUpP"
        >
          Click here if not redirected automatically
        </a>
      </div>
    </div>

    <script>
      // Update fallback button href with current query string if present
      (function () {
        try {
          var targetCalendarUrl = "https://api.leadconnectorhq.com/widget/booking/dPjD3K2ESbGLgoRuoUpP";
          var search = window.location.search || "";
          var hash = window.location.hash || "";
          var link = document.getElementById("manual-link");
          if (link) {
            link.href = targetCalendarUrl + search + hash;
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
